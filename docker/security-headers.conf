# 安全性 HTTP 標頭。每個 location 都要 include 一次：
# nginx 的規則是 location 裡只要有自己的 add_header，就不會繼承外層的 add_header。
add_header X-Content-Type-Options "nosniff" always;              # 禁止瀏覽器猜測檔案類型
add_header X-Frame-Options "SAMEORIGIN" always;                  # 禁止被其他網站用 iframe 嵌入
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
